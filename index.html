<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LastWar S7 データベース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4DCC5; --surface:#F1ECDD; --surface2:#EAE3CF; --ink:#1F2A31; --muted:#56615C;
  --line:#C6BB9C; --accent:#C97A12; --accent-ink:#1F2A31; --steel:#2E4552; --steel-ink:#F1ECDD;
  --war:#A8402C; --grow:#46703F; --season:#6A4C93; --hl:rgba(201,122,18,.18);
  --font-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172128; --surface:#1F2C34; --surface2:#25343D; --ink:#E4DCC5; --muted:#9BA8A3;
    --line:#33454F; --accent:#E8A23A; --accent-ink:#172128; --steel:#8DB0C2; --steel-ink:#172128;
    --war:#E07A64; --grow:#8CC07F; --season:#B49BE0; --hl:rgba(232,162,58,.18); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#172128; --surface:#1F2C34; --surface2:#25343D; --ink:#E4DCC5; --muted:#9BA8A3;
  --line:#33454F; --accent:#E8A23A; --accent-ink:#172128; --steel:#8DB0C2; --steel-ink:#172128;
  --war:#E07A64; --grow:#8CC07F; --season:#B49BE0; --hl:rgba(232,162,58,.18); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);color:var(--steel-ink)}
.top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px 16px;padding:8px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.stamp{font-family:var(--font-display);font-size:22px;line-height:1;padding:5px 8px 4px;border:3px solid var(--accent);color:var(--accent);transform:rotate(-4deg)}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0;letter-spacing:.06em}
nav.tabs{display:flex;gap:4px}
nav.tabs a{color:inherit;text-decoration:none;padding:4px 12px;border-radius:4px;font-weight:500;font-size:14px;opacity:.85}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);opacity:1}
.meta{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;line-height:1.4;opacity:.85}
.theme-btn{background:none;border:1px solid currentColor;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;opacity:.85}
@media (max-width:600px){
  .top-inner{padding:6px 12px}
  .stamp{font-size:15px;padding:3px 5px 2px;border-width:2px}
  .brand h1{font-size:15px}
  nav.tabs a{padding:3px 9px;font-size:13px}
  .meta{font-size:10px}
  .theme-btn{font-size:11px;padding:1px 6px}
}
main{max-width:1180px;margin:0 auto;padding:16px 20px 48px}
@media (max-width:600px){main{padding:10px 12px 40px}}
.view{display:none}.view.active{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-family:var(--font-display);font-weight:400;font-size:16px;margin:0 0 6px;letter-spacing:.03em}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:4px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:4px 11px;font-size:13px}
.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:2px;font-size:13px;margin-bottom:8px}
.field > span{color:var(--muted)}
.field input,.field select{padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);min-width:0;width:100%;box-sizing:border-box}
.field select.unset{border-color:var(--accent);box-shadow:0 0 0 2px var(--hl)}
.tl{border-collapse:collapse;width:100%;font-size:14px}
.tl th,.tl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tl th{white-space:nowrap}
.tl tr.now > *{background:var(--hl)}
.tbl-scroll{overflow-x:auto}
.sr{position:absolute;left:-9999px}

/* kind labels */
.kind{display:inline-block;min-width:2.6em;text-align:center;font-size:11px;font-weight:700;line-height:1;padding:3px 4px 2px;border-radius:3px;color:var(--bg);margin-right:6px;vertical-align:1px;white-space:nowrap}
.k-season{background:var(--war)}.k-base{background:var(--grow)}.k-hero{background:var(--season)}.k-other{background:var(--steel)}.k-none{background:var(--muted)}

/* layout */
.chat-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:540px;min-width:0}
.log{flex:1;overflow-y:auto;padding:16px}
.msg{margin:0 0 16px}
.msg.user{margin-left:auto;max-width:80%;width:fit-content;background:var(--steel);color:var(--steel-ink);padding:8px 14px;border-radius:12px 12px 2px 12px}
.msg.bot .who{font-size:12px;color:var(--muted);margin-bottom:4px}
.bubble{border-left:3px solid var(--accent);padding:2px 0 2px 12px;max-width:720px}
.bubble p{margin:.2em 0 .6em}
.bubble h3{font-size:14px;margin:12px 0 4px;color:var(--muted)}
.bubble ul{margin:.2em 0 .6em;padding-left:1.2em}
.tt{border-collapse:collapse;margin:6px 0 8px;font-size:14px}
.tt th{text-align:right;padding:4px 10px 4px 0;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:top;color:var(--muted);font-weight:700}
.tt td{padding:4px 0;border-left:2px solid var(--line);padding-left:10px}
.tt tr.reset td{color:var(--muted);font-size:13px}
.tt tr.past td,.tt tr.past th{opacity:.45}
.tt tr.next th{color:var(--accent)}
.nexttag{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:1px 5px}
.contrib-in{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font:inherit}
.tfb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.tfb-in{flex:1;min-width:140px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.testbadge{background:var(--war);color:var(--bg);font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:3px}
.link{background:none;border:none;padding:1px 0;text-align:left;cursor:pointer;color:inherit;font:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.bubble .lead{font-weight:700;font-size:16px}
.bubble .role{font-size:12px;color:var(--accent);font-weight:700;margin-left:4px}
.points{background:var(--surface2);border-radius:4px;padding:8px 12px;margin-top:8px;font-size:14px}
.points b{display:block;font-size:12px;color:var(--muted)}
.typing{color:var(--muted);font-size:13px;margin-bottom:12px}
.composer{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.shot{border:1px solid var(--line);border-radius:4px;background:var(--surface2);padding:0;cursor:zoom-in;max-width:100%;overflow:hidden}
.shot img{display:block;max-height:180px;width:auto}
.shot .ph{display:block;width:180px;height:70px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center}

.side{position:sticky;top:76px;min-width:0}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.cgrid .field{min-width:0}
.wklabel{font-size:13px;color:var(--muted)}
.wkbtns{display:grid;grid-template-columns:1.4fr repeat(8,1fr);gap:3px;margin:4px 0 6px}
.wkbtns button{padding:5px 0 4px;border:1px solid var(--line);background:var(--bg);border-radius:3px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.3}
.wkbtns button.pre{font-size:11px}
.wkbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wkbtns small{display:block;font-size:9px;font-weight:500;line-height:1}
.status{font-size:13px;margin:0}
.wkrange{font-size:14px;font-weight:700;margin:0 0 4px}
.wkrange:empty{display:none}
.hint{font-size:12px;color:var(--muted);margin:0 0 6px}
.kfilter{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
.kfilter button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:1px 10px;font-size:12px;cursor:pointer}
.kfilter button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.sec{font-size:13px;font-weight:700;margin:10px 0 2px;color:var(--muted)}
.day{font-size:13px;font-weight:700;margin:8px 0 0;color:var(--muted)}
.day.today{color:var(--accent)}
.ev{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line);padding:5px 2px;cursor:pointer;font-size:14px}
.ev:hover{background:var(--hl)}
.ev .tm{font-weight:700;min-width:3.1em;font-variant-numeric:tabular-nums}
.ev .sub{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.ev .new{font-size:11px;color:var(--accent);font-weight:700;margin-left:4px}
.empty{font-size:13px;color:var(--muted);margin:4px 0}

.mbar,.sheet-close{display:none}
.scrim[hidden]{display:none}
@media (max-width:900px){
  .chat-wrap{display:block}
  .mbar{display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}
  .mbar-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700}
  .mev{width:100%}
  .side{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;overflow-y:auto;z-index:30;background:var(--bg);border-top:3px solid var(--accent);border-radius:12px 12px 0 0;padding:10px 14px calc(16px + env(safe-area-inset-bottom,0px))}
  .side.open-cond,.side.open-ev{display:block}
  .side.open-cond #pEv,.side.open-ev #pCond{display:none}
  .sheet-close{display:block;margin:0 0 8px auto}
  .scrim{position:fixed;inset:0;background:rgba(10,15,18,.5);z-index:25}
  .chat{height:auto;min-height:0}
  .log{min-height:45vh;overflow:visible}
  .composer{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-radius:0 0 6px 6px;z-index:4}
}

/* zukan */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.zcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.zcard .zimg{height:110px;display:flex;align-items:center;justify-content:center;background:var(--surface2);overflow:hidden}
.zcard .zimg img{max-height:110px}
.zcard .zt{padding:8px 10px}
.zcard strong{display:block;font-size:14px}
.zcard small{color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:min(640px,94vw);padding:14px}
dialog::backdrop{background:rgba(10,15,18,.6)}
dialog img{display:block;max-width:100%;margin:0 auto}
.loading{padding:40px;text-align:center;color:var(--muted)}
.err{border-left:4px solid var(--war);padding:8px 12px;background:var(--surface);margin:10px 0}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="stamp" aria-hidden="true">S7</span><h1>データベース</h1><span class="testbadge" id="testBadge" hidden>テスト版</span></div>
    <nav class="tabs" aria-label="画面切り替え">
      <a href="#ask" data-view="ask">調べる</a>
      <a href="#zukan" data-view="zukan">図鑑</a>
    </nav>
    <div class="meta"><span id="updated">読み込み中…</span><span>#720 カニカフの趣味によるまとめです</span></div>
    <button class="theme-btn" id="langBtn" type="button">EN</button>
  </div>
</header>

<main>
<section class="view" id="view-ask" aria-label="調べる">
  <div class="chat-wrap">
    <div class="mbar" id="mbar">
      <div class="mbar-row"><span id="mSum"></span><button type="button" class="btn ghost small" data-sheet="cond">条件を変える</button></div>
      <div class="wkbtns" id="mWk" role="group" aria-label="シーズンの週"></div>
      <p class="wkrange" id="mWkRange" style="font-size:13px"></p>
      <button type="button" class="btn small mev" data-sheet="ev" id="mEvBtn">この週のイベントを見る</button>
    </div>
    <div class="chat">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="composer" id="ask">
        <label for="q" class="sr">質問</label>
        <input id="q" placeholder="質問を入力" autocomplete="off" enterkeyhint="send">
        <button class="btn" type="submit">送る</button>
      </form>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <aside class="side" id="side">
      <section class="panel" id="pCond">
        <button type="button" class="btn ghost small sheet-close" data-close="1">閉じる</button>
        <h2>あなたの条件</h2>
        <div class="cgrid">
          <label class="field"><span>サーバー番号</span><input id="cServer" type="number" inputmode="numeric" min="1" max="9999" placeholder="例：720"></label>
          <label class="field"><span>職業</span><select id="cJob"><option value="">選んでください</option><option value="エンジニア">エンジニア</option><option value="戦争指導者">戦争指導者</option></select></label>
          
          <label class="field"><span>役職</span><select id="cRole">
            <option value="">選んでください</option><option value="盟主">盟主</option><option value="戦神">戦神</option><option value="女神">女神</option><option value="理事">理事</option><option value="執事">執事</option><option value="R4">R4（役職なし）</option><option value="一般">一般メンバー</option></select></label>
          <label class="field" style="grid-column:1/-1"><span>作戦計画システム</span><select id="cPlan"></select></label>
        </div>
        <div class="wklabel">シーズンの週</div>
        <div class="wkbtns" id="wkBtns" role="group" aria-label="シーズンの週"></div>
        <p class="wkrange" id="wkRange"></p>
        <p class="status" id="status"></p>
      </section>
      <section class="panel" id="pEv">
        <button type="button" class="btn ghost small sheet-close" data-close="1">閉じる</button>
        <h2 id="evTitle">イベント</h2>
        <p class="hint">イベントを押すと説明が出ます</p>
        <div class="kfilter" id="kfilter" role="group" aria-label="種類で絞り込む"></div>
        <div id="evList"><div class="empty">読み込み中…</div></div>
      </section>
    </aside>
  </div>
</section>

<section class="view" id="view-zukan" aria-label="図鑑">
  <div class="kfilter" id="zFilter" role="group" aria-label="図鑑の分類"></div>
  <div class="zgrid" id="zgrid"><div class="loading">読み込み中…</div></div>
</section>
</main>

<dialog id="dlg"><div id="dlgBody"></div><div style="text-align:right;margin-top:10px"><button class="btn small" type="button" id="dlgClose">閉じる</button></div></dialog>

<script>
(function(){
'use strict';
/* ===== 設定 ===== */
var API = 'https://script.google.com/macros/s/AKfycbyIHECaAgs40MMnkPq_P8II6fe4H10sT7kBKyZBdJ4aqYeh8mLb1TwGz3136Ipp4BGAmA/exec';
var DOW = ['日','月','火','水','木','金','土'];
var KIND = {'シーズンイベント':['イベ','k-season'],'基地育成':['基地','k-base'],'英雄育成':['英雄','k-hero'],'その他イベント':['他','k-other']};
var KIND_OLD = {'戦争':'シーズンイベント','育成':'基地育成'};
function kindOf(r){var k=r['種類']||'';return KIND_OLD[k]||k}
var ROLE_TAGS = {'盟主':['盟主','R5','幹部'],'戦神':['戦神','R4','幹部'],'女神':['女神','R4','幹部'],'理事':['理事','R4','幹部'],'執事':['執事','R4','幹部'],'R4':['R4','R4（役職なし）','幹部'],'一般':['一般']};

var $ = function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function num(v){var n=parseInt(String(v).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}),10);return isNaN(n)?null:n}
function split(v){return String(v||'').split(/[,、，\s]+/).filter(Boolean)}

/* ===== テスト版（?test=1 で有効、?test=0 で解除。スマホに記憶） ===== */
var TEST=(function(){var m=location.search.match(/[?&]test=([01])/);if(m){store('s7db_test',m[1]==='1');}return !!store('s7db_test')})();
var CUR=null, ansType='', NEED_AI=false, VIA_AI=false;
function newLogId(){return 'L'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function sendLog(params){if(!TEST)return;var qs=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');fetch(API+'?type=log&'+qs).catch(function(){})}

/* ===== 言語（日本語／English）：画面の文字だけを切り替える ===== */
var LANG=store('s7db_lang')||'ja';
var UI_EN={
 'データベース':'Database','調べる':'Search','図鑑':'Gallery','表示切替':'Theme','情報更新':'Updated','読み込み中…':'Loading…','読み込み失敗':'Load failed',
 '#720 カニカフの趣味によるまとめです':'Unofficial hobby guide by Kanikafu (#720)','テスト版':'TEST',
 'あなたの条件':'Your settings','サーバー番号':'Server No.','職業':'Class','エンジニア':'Engineer','戦争指導者':'War Leader','選んでください':'Select',
 '役職':'Alliance rank','盟主':'R5','戦神':'Warlord','女神':'Muse','理事':'Recruiter','執事':'Butler','R4（役職なし）':'R4 (no title)','一般メンバー':'Member (R1–R3)',
 '作戦計画システム':'Battle plan','まだ選んでいない':'Not chosen yet','シーズンの週':'Season week','開幕前':'Pre-season','いま':'now',
 'イベントを押すと説明が出ます':'Tap an event for details','すべて':'All','シーズン':'Season','基地':'Base','英雄':'Hero','その他':'Other','イベ':'EV','他':'ETC',
 'シーズンイベント':'Season event','基地育成':'Base growth','英雄育成':'Hero growth','その他イベント':'Other event',
 '毎日やること':'Daily tasks','今週開催中':'Running this week','曜日・時刻のイベント':'Events by day & time','今週から':'new this week','今日':'today',
 '閉じる':'Close','条件を変える':'Settings','質問を入力':'Ask a question','送る':'Send','考えています…':'Thinking…',

// ゲームの1日はサーバー時間（UTC-2）の0時で切り替わる。日付はサーバー日で数え、時刻は端末の時間で表示する
var SERVER_OFFSET_MIN=-120;
function serverToday(){var x=new Date(Date.now()+SERVER_OFFSET_MIN*60000);return new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate()))}

function pdate(s){
  s=String(s||'');var m=s.match(/(\d{4})\s*[\/\-\.年]\s*(\d{1,2})\s*[\/\-\.月]\s*(\d{1,2})/);
  if(m) return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  m=s.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);   // 12/14/2026 の形
  return m?new Date(Date.UTC(+m[3],+m[1]-1,+m[2])):null;
}
function md(d){return (d.getUTCMonth()+1)+'/'+d.getUTCDate()}

function epochOf(dayDateUtc,hhmm){var m=String(hhmm||'').match(/(\d{1,2}):(\d{2})/);if(!m||!dayDateUtc)return null;return dayDateUtc.getTime()+((+m[1])*60+(+m[2]))*60000-SERVER_OFFSET_MIN*60000}

function localTime(dayDateUtc,hhmm){
  var base=dayDateUtc||serverToday(), e=epochOf(base,hhmm); if(e==null) return '';
  var t=new Date(e), r=new Date(epochOf(base,'0:00'));
  var next=t.getDate()!==r.getDate()||t.getMonth()!==r.getMonth();
  return (next?'翌':'')+t.getHours()+':'+pad(t.getMinutes());

var partCache={};
function partHtml(ids){
  ids=ids.filter(function(x,i,a){return x&&a.indexOf(x)===i});
  if(!ids.length) return '';
  return '<div class="shots">'+ids.map(function(id){return '<button type="button" class="shot" data-part="'+esc(id)+'"><span class="ph">画像を読み込み中…</span></button>'}).join('')+'</div>';
}
function loadPart(id){
  if(partCache[id]) return Promise.resolve(partCache[id]);
  var c=store('s7db_p_'+id); if(c){partCache[id]=c;return Promise.resolve(c);}
  return fetch(API+'?type=part&id='+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(j){
    if(!j.ok) throw new Error(j.error);
    var src='data:'+j.mime+';base64,'+j.data; partCache[id]=src; store('s7db_p_'+id,src); return src;
  });
}
function hydrateParts(scope){
  scope.querySelectorAll('[data-part]').forEach(function(b){
    if(b.dataset.done) return; b.dataset.done='1';
    loadPart(b.dataset.part).then(function(src){b.innerHTML='<img alt="" src="'+src+'">'}).catch(function(){b.innerHTML='<span class="ph">画像を読み込めませんでした</span>'});
  });
}
function partName(id){var p=(D&&D['画像パーツ']||[]).filter(function(x){return x['パーツID']===id})[0];return p?p['何を示すか']:''}

  var seen={}; lines=lines.filter(function(r){var k=(r['やること（1行）']||r['内容'])+'|'+forWho(r);if(seen[k])return false;seen[k]=1;return true});
  if(lines.length) h+=doLines(lines);

function answerDay(d,slot,withOngoing){
  var S=season(), w=Math.ceil(d/7), dd=dayDate(d,S);
  var all=rows('予定表').filter(function(r){var a=num(r['開始日目']),b=num(r['終了日目']);if(a==null)return false;if(b==null)b=a;return a<=d&&b>=d});

  var multi=all.filter(function(r){var a=num(r['開始日目']),e=num(r['終了日目']||r['開始日目']);return e!==a&&(a===d||e===d)});
  var daily=rows('毎日やること').filter(function(r){return inWeek(r,w)});

  var items=[];
  single.forEach(function(g){if(g.time)items.push({t:g.time,html:'<button type="button" class="link" data-name="'+esc(g.name)+'" data-day="'+g.day+'" data-time="'+esc(g.time)+'">'+kindLabel(g.kind)+esc(g.name)+(g.rows[0]['内容']?' '+esc(g.rows[0]['内容']):'')+'</button>'})});

  items.forEach(function(x){x.e=epochOf(dd||serverToday(),x.t)});
  items.sort(function(a,b){return a.e-b.e});
  if(slot){items=items.filter(function(x){var hh=new Date(x.e).getHours();return slot==='朝'?hh>=5&&hh<12:slot==='昼'?hh>=12&&hh<18:slot==='夜'?hh>=18:slot==='深夜'?hh<5:true})}
  var now=Date.now(), isToday=dd&&dd.getTime()===TODAY.getTime(), nextDone=false;

  var untimed=single.filter(function(g){return !g.time});
  var udaily=daily.filter(function(r){return !r['時刻']});
  var dailyHtml=udaily.length?'<h3>毎日やること</h3><ul>'+udaily.map(function(r){return '<li><button type="button" class="link" data-m="'+esc(r['毎日ID'])+'">'+kindLabel(r['種類'])+esc(r['名前'])+'</button></li>'}).join('')+'</ul>':'';

    items.forEach(function(x){
      var past=isToday&&x.e<now, nx=isToday&&!past&&!nextDone; if(nx)nextDone=true;

    });
    h+='</tbody></table>';

  if(untimed.length) h+='<h3>この日の予定（時刻なし）</h3><ul>'+untimed.map(function(g){return '<li><button type="button" class="link" data-name="'+esc(g.name)+'" data-day="'+g.day+'" data-time="">'+kindLabel(g.kind)+esc(g.name)+(g.rows[0]['内容']?' '+esc(g.rows[0]['内容']):'')+'</button></li>'}).join('')+'</ul>';
  if(multi.length) h+='<h3>この日に始まる・終わるもの</h3><ul>'+multi.map(function(r){var st_=num(r['開始日目'])===d;return '<li><button type="button" class="link" data-name="'+esc(r['イベント名'])+'">'+kindLabel(r['種類'])+esc(r['イベント名'])+(r['内容']?' '+esc(r['内容']):'')+'</button> <span class="muted">'+(st_?'開始（〜'+r['終了日目']+'日目）':'最終日')+'</span></li>'}).join('')+'</ul>';
  if(withOngoing){
    var ongoing=dedupe(all.filter(function(r){var a=num(r['開始日目']),e=num(r['終了日目']||r['開始日目']);return e!==a&&a!==d&&e!==d}).concat(rows('期間イベント').filter(function(r){return inWeek(r,w)})));
    if(ongoing.length) h+='<h3>この日も開催中</h3><ul>'+ongoing.map(function(r){var rng=r['開始日目']?('Day'+r['開始日目']+'〜'+r['終了日目']):('第'+r['開始週']+(r['終了週']&&r['終了週']!==r['開始週']?'〜'+r['終了週']:'')+'週');return '<li><button type="button" class="link" data-name="'+esc(r['イベント名'])+'">'+kindLabel(r['種類'])+esc(r['イベント名'])+(r['内容']?' '+esc(r['内容']):'')+'</button> <span class="muted">'+rng+'</span></li>'}).join('')+'</ul>';
  }

  if(items.length) h+='<p class="muted" style="font-size:12px">時刻はこの端末の時間で表示しています（1日の区切りはサーバー時間0時）。</p>';
  if(!withOngoing) h+='<p><button type="button" class="link" data-week="'+w+'">第'+w+'週に開催中のイベントを見る</button></p>';
  botSay(h);

  // 今週・来週：開幕前なら、開幕日から逆算して開幕前の準備を出す
  if(/今週|来週/.test(t)){
    var nx=/来週/.test(t)?1:0;
    if(S.phase==='pre'){var u2=S.until-nx*7;if(u2<1){answerWeek(1);return}
      answerPre(u2<=7?1:u2<=14?2:0,(nx?'来週は':'')+'開幕まであと'+u2+'日'+(nx?'の時期です。':'です。'));return}
    var cw=curWeek(); if(typeof cw!=='number')cw=1;
    answerWeek(Math.min(8,cw+nx));return
  }
  if(/毎日|デイリー/.test(t)){var w=curWeek(),list=rows('毎日やること').filter(function(r){return inWeek(r,w)});
    if(list.length){ansType='毎日';botSay('<p class="lead">第'+w+'週の毎日やること</p>'+doLines(list)+partHtml(list.map(function(r){return r['パーツID']})));return}}
  // 「〇〇はある？」：名前がデータに無ければ、関係の薄いメモを出さずに「登録されていません」と答える
  if(/(ある|あります)(の|か|かな|ですか|んですか)?[?？!！。]*$/.test(t)){
    var subj=t.replace(/(は|って|も|が)?(ある|あります)(の|か|かな|ですか|んですか)?[?？!！。]*$/,'').replace(/^(S7|シーズン7|今シーズン|シーズン)(に|で)?(は)?/i,'');
    if(subj.length>=2&&!/何|なに|どんな|どれ|いつ|どこ|誰|だれ/.test(subj)){
      var partsQ=subj.split(/の|と/).filter(function(x){return x.length>=2});
      if(partsQ.length&&!partsQ.every(knownWord)){ansType='未登録';botSay('<p>S7の情報には「'+esc(subj)+'」は登録されていません。</p>');return}
    }
  }
  // イベント名
  if(ev.length){answerEvent(ev[0],{detail:detail});return}
  // 知識メモ
  var ks=rows('知識メモ').filter(function(k){
    var keys=[k['項目']].concat(split(k['タグ'])).filter(function(x){return x&&x.length>=2});
    return keys.some(function(x){return t.indexOf(x)>=0||(t.length>=2&&x.indexOf(t)>=0)});
  });
  // 入手・上限を聞かれたとき：その話題のメモ（毎日やることも含む）から、入手方法・上限が書かれたものを先に出す（S7が先、S3実績は後ろ）
  var want=/入手/.test(t)?/入手|集め|稼|得る|もらえ|生産|手に入/:/上限/.test(t)?/上限|回/:null;
  if(want&&ks.length){
    var terms=[];
    ks.forEach(function(k){[k['項目']].concat(split(k['タグ'])).forEach(function(x){if(x&&x.length>=2&&t.indexOf(x)>=0&&terms.indexOf(x)<0)terms.push(x)})});
    if(/シーズン資源/.test(t)) terms=terms.concat(['聖水','ミスリル']);
    var P='要点（管理者の言葉・1〜2行）';
    var pool=rows('知識メモ').map(function(k){return {r:k,txt:k['項目']+' '+k['タグ']+' '+k[P],body:k[P]}})
      .concat(rows('毎日やること').map(function(m){var r={'項目':m['名前']+'（毎日）','タグ':'','パーツID':m['パーツID'],'対象職業':m['対象職業'],'対象作戦計画':m['対象作戦計画'],'対象役職':m['対象役職']};r[P]=m['やること（1行）'];return {r:r,txt:m['名前']+' '+m['やること（1行）'],body:m['やること（1行）']}}));
    var cand=pool.filter(function(p){return terms.some(function(x){return p.txt.indexOf(x)>=0})});
    var good=cand.filter(function(p){return want.test(p.body)}), rest=cand.filter(function(p){return good.indexOf(p)<0});
    var s7f=function(a){return a.filter(function(p){return !isS3(p.r)}).concat(a.filter(function(p){return isS3(p.r)}))};
    var picked=s7f(good).concat(s7f(rest)).map(function(p){return p.r});
    var wn='';
    if(/上限/.test(t)&&!picked.slice(0,6).some(function(r){return /1日に?\d+回|\d+回まで|上限\d+/.test(r[P])})) wn='1日に獲得できる回数の上限は、まだ登録されていません。';
    if(picked.length){answerKnowledge(picked,wn,6);return}
  }
  if(ks.length){
    var an='';
    // 覚醒：対象ではない英雄の名前が入っていたら、覚醒できる英雄と「情報なし」を添える
    if(/覚醒/.test(t)){
      var aw=rows('知識メモ').filter(function(k){return /覚醒/.test(k['項目'])&&/対象は/.test(k['要点（管理者の言葉・1〜2行）'])})[0];
      if(aw){
        var tm=aw['要点（管理者の言葉・1〜2行）'].match(/対象は(.+?)。/), targets=tm?tm[1].split(/[・、]/).map(function(x){return x.replace(/（.*?）|\(.*?\)/g,'')}).filter(Boolean):[];
        var kw=(t.match(/[ァ-ヶー]{2,}/g)||[]).filter(function(x){return targets.indexOf(x)<0});
        if(targets.length&&kw.length) an='S7で覚醒できるのは'+esc(targets.join('・'))+'の'+targets.length+'人です。'+esc(kw[0])+'の覚醒の情報は登録されていません。';
      }
    }
    answerKnowledge(preferS7(ks),an);return}
  // 図鑑・画像パーツ
  var ps=(D['画像パーツ']||[]).filter(function(p){var n=p['何を示すか']||'';return t.length>=2&&(n.indexOf(t)>=0||t.indexOf(n.replace(/（.*?）/g,''))>=0)});
  if(ps.length){botSay('<p class="lead">関連する画像</p>'+partHtml(ps.slice(0,4).map(function(p){return p['パーツID']})));return}
  NEED_AI=true;   // 言葉のパターンでは答えられなかった → AIに振り分けを頼む
}

[['answerWeek','週'],['answerDay','日'],['answerEvent','イベント'],['answerKnowledge','知識'],['answerOverview','流れ'],['answerSchedule','開幕日'],['answerAllDays','日ごと一覧'],['answerDaily','毎日'],['answerPre','開幕前'],['notFound','見つからない']].forEach(function(x){
  var f=eval(x[0]); var w=function(){ansType=x[1];return f.apply(this,arguments)};
  eval(x[0]+'=w');
});
$('#ask').addEventListener('submit',function(e){
  e.preventDefault(); var q=$('#q').value.trim(); if(!q) return; $('#q').value='';
  userSay(q);
  if(!D){botSay('<p>データを読み込み中です。少し待ってからもう一度送ってください。</p>');return}
  CUR={id:newLogId(),q:q}; ansType=''; NEED_AI=false; VIA_AI=false;
  handle(q);
  if(NEED_AI){
    if(D&&D.ai===true){var cur=CUR;CUR=null;askAI(q,cur);return}
    notFound(q);                                   // AIオフ：すぐに「見つからない」→ リクエストに記録
  }
  if(CUR&&!CUR.sent&&TEST){botSay('<p class="muted">（答えを作れませんでした）</p>')}
  CUR=null;
});
log.addEventListener('click',function(e){
  var b=e.target.closest('[data-part]');if(b&&b.querySelector('img')){openImg(b.dataset.part);return}
  var ev=e.target.closest('[data-eval]');
  if(ev){var box=ev.closest('.tfb'),id=box.dataset.log;
    if(ev.dataset.eval==='○'){sendLog({id:id,eval:'○'});box.innerHTML='<span class="muted">ありがとうございます（記録しました）</span>';}
    else{box.innerHTML='<span class="muted">何が知りたかったですか？（任意）</span><input type="text" class="tfb-in" maxlength="150"><button type="button" class="btn small" data-evsend="1">送る</button>';box.querySelector('input').focus();}
    return}
  var es=e.target.closest('[data-evsend]');
  if(es){var box2=es.closest('.tfb');sendLog({id:box2.dataset.log,eval:'×',comment:box2.querySelector('input').value||''});box2.innerHTML='<span class="muted">ありがとうございます（記録しました）</span>';return}
  var l=e.target.closest('.link');if(!l)return;
  if(l.dataset.m){answerDaily(l.dataset.m);return}
  if(l.dataset.week){answerWeek(+l.dataset.week);return}
  if(l.dataset.k){answerKnowledge((D['知識メモ']||[]).filter(function(x){return x['知識ID']===l.dataset.k}));return}
  var nm=l.dataset.name;
  if(l.dataset.day){if(!answerEvent(nm,{day:+l.dataset.day,time:l.dataset.time||''}))botSay('<p>詳しい情報はまだ登録されていません。</p>');}
  else if(!answerEvent(nm)) botSay('<p>詳しい情報はまだ登録されていません。</p>');
});

/* ===== 右側の操作 ===== */
function openSheet(k){var sd=$('#side');sd.classList.remove('open-cond','open-ev');if(k)sd.classList.add('open-'+k);$('#scrim').hidden=!k}
$('#scrim').addEventListener('click',function(){openSheet(null)});
function sideClick(e){
  var sh=e.target.closest('[data-sheet]'); if(sh){openSheet(sh.dataset.sheet);return}
  if(e.target.closest('[data-close]')){openSheet(null);return}
  var wk=e.target.closest('[data-wk]'); if(wk){st.week=wk.dataset.wk==='pre'?'pre':+wk.dataset.wk;renderCond();renderEvents();return}
  var kd=e.target.closest('[data-kind]'); if(kd){st.kind=kd.dataset.kind;renderKindFilter();renderEvents();return}
  var ev=e.target.closest('.ev'); if(!ev) return;
  openSheet(null);
  if(ev.dataset.m){var r=(D['毎日やること']||[]).filter(function(x){return x['毎日ID']===ev.dataset.m})[0];userSay((r?r['名前']:'')+'は、なにをする？');answerDaily(ev.dataset.m);return}
  if(ev.dataset.k){var k=(D['知識メモ']||[]).filter(function(x){return x['知識ID']===ev.dataset.k});userSay((k[0]?k[0]['項目']:'')+'について');answerKnowledge(k);return}
  if(ev.dataset.pre){userSay('開幕前の予定は？');answerSchedule();return}
  var name=ev.dataset.name;
  if(ev.dataset.day){var d=+ev.dataset.day,S=season();userSay(dayLabel(d,S).replace(/（.*）/,'')+(ev.dataset.time?' '+ev.dataset.time:'')+' の'+name+'は、なにをする？');answerEvent(name,{day:d,time:ev.dataset.time||''});return}
  userSay(name+'は、なにをする？'); if(!answerEvent(name)) botSay('<p>詳しい情報はまだ登録されていません。</p>');
}

/* ===== 図鑑 ===== */
function zukanItems(){
  var a=[];
  rows('期間イベント').forEach(function(r){if(r['図鑑の分類']&&r['パーツID'])a.push({cat:r['図鑑の分類'],name:r['イベント名'],text:r['やること（1行）'],part:r['パーツID'],key:r['イベント名']})});
  rows('知識メモ').forEach(function(r){if(r['図鑑の分類']&&r['パーツID'])a.push({cat:r['図鑑の分類'],name:r['項目'],text:r['要点（管理者の言葉・1〜2行）'],part:r['パーツID'],key:r['項目']})});
  var seen={};return a.filter(function(x){var k=x.cat+x.name;if(seen[k])return false;seen[k]=1;return true});
}
function renderZukan(){
  if(!D) return;
  var items=zukanItems(), cats=[];
  items.forEach(function(x){if(cats.indexOf(x.cat)<0)cats.push(x.cat)});
  if(st.zk!=='all'&&cats.indexOf(st.zk)<0) st.zk='all';
  $('#zFilter').innerHTML=['all'].concat(cats).map(function(c){return '<button type="button" data-zk="'+esc(c)+'" aria-pressed="'+(st.zk===c)+'">'+(c==='all'?'すべて':esc(c))+'</button>'}).join('');
  var list=items.filter(function(x){return st.zk==='all'||x.cat===st.zk});
  $('#zgrid').innerHTML=list.length?list.map(function(x,i){return '<button type="button" class="zcard" data-zi="'+items.indexOf(x)+'"><span class="zimg" data-part="'+esc(x.part)+'"><span class="ph">…</span></span><span class="zt"><strong>'+esc(x.name)+'</strong><small>'+esc(x.cat)+'</small></span></button>'}).join(''):'<div class="loading">図鑑はまだ登録がありません。</div>';
  zukanItems._cache=items;
  if($('#view-zukan').classList.contains('active')) hydrateParts($('#zgrid'));
}
$('#zFilter').addEventListener('click',function(e){var b=e.target.closest('[data-zk]');if(!b)return;st.zk=b.dataset.zk;renderZukan()});
$('#zgrid').addEventListener('click',function(e){
  var c=e.target.closest('[data-zi]'); if(!c) return; var x=zukanItems._cache[+c.dataset.zi]; if(!x) return;

  hydrateParts($('#dlgBody')); $('#dlg').showModal();
});

}

  if(!st.server||!st.job||!st.role) botSay('<p>はじめに、'+(innerWidth<900?'上の「条件を変える」':'右側')+'でサーバー番号・職業・役職を選んでください。あなたに関係する情報だけを表示します。</p>');
